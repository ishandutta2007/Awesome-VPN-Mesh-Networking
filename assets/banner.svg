<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 8px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes pulseNodePink {
      0%, 100% { r: 5px; opacity: 0.5; }
      50% { r: 7.5px; opacity: 0.95; filter: drop-shadow(0 0 8px #f43f5e); }
    }
    @keyframes pulseNodeGreen {
      0%, 100% { r: 4.5px; opacity: 0.5; }
      50% { r: 7px; opacity: 0.95; filter: drop-shadow(0 0 8px #10b981); }
    }
    @keyframes packetFlow1 {
      0% { cx: 120px; cy: 110px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 280px; cy: 60px; opacity: 0; }
    }
    @keyframes packetFlow2 {
      0% { cx: 1080px; cy: 110px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 920px; cy: 60px; opacity: 0; }
    }
    @keyframes packetFlow3 {
      0% { cx: 200px; cy: 320px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 380px; cy: 350px; opacity: 0; }
    }
    @keyframes packetFlow4 {
      0% { cx: 1000px; cy: 320px; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { cx: 820px; cy: 350px; opacity: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .node-blue { animation: pulseNode 3s infinite ease-in-out; }
    .node-pink { animation: pulseNodePink 3.6s infinite ease-in-out; }
    .node-green { animation: pulseNodeGreen 4.2s infinite ease-in-out; }
    .flow-packet-1 { animation: packetFlow1 4s infinite linear; }
    .flow-packet-2 { animation: packetFlow2 4.5s infinite linear 1s; }
    .flow-packet-3 { animation: packetFlow3 5s infinite linear 0.5s; }
    .flow-packet-4 { animation: packetFlow4 4.8s infinite linear 1.5s; }
    .pill-anim-1 { animation: floatPill1 6s infinite ease-in-out; }
    .pill-anim-2 { animation: floatPill2 5.5s infinite ease-in-out; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Center Radial Glow -->
  <circle cx="600" cy="200" r="420" fill="url(#meshCenter)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Animated Mesh Topology Lines (Left Flank) -->
  <g stroke="url(#lineGrad1)" stroke-width="1.8" stroke-dasharray="4,4" fill="none">
    <line x1="120" y1="110" x2="280" y2="60" />
    <line x1="120" y1="110" x2="190" y2="200" />
    <line x1="190" y1="200" x2="280" y2="60" />
    <line x1="190" y1="200" x2="130" y2="290" />
    <line x1="130" y1="290" x2="240" y2="340" />
    <line x1="190" y1="200" x2="240" y2="340" />
    <line x1="280" y1="60" x2="390" y2="120" />
    <line x1="240" y1="340" x2="380" y2="350" />
  </g>

  <!-- Dynamic Animated Mesh Topology Lines (Right Flank) -->
  <g stroke="url(#lineGrad2)" stroke-width="1.8" stroke-dasharray="4,4" fill="none">
    <line x1="1080" y1="110" x2="920" y2="60" />
    <line x1="1080" y1="110" x2="1010" y2="200" />
    <line x1="1010" y1="200" x2="920" y2="60" />
    <line x1="1010" y1="200" x2="1070" y2="290" />
    <line x1="1070" y1="290" x2="960" y2="340" />
    <line x1="1010" y1="200" x2="960" y2="340" />
    <line x1="920" y1="60" x2="810" y2="120" />
    <line x1="960" y1="340" x2="820" y2="350" />
  </g>

  <!-- Animated Flying Packets Along Mesh Lines -->
  <circle class="flow-packet-1" cx="120" cy="110" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle class="flow-packet-2" cx="1080" cy="110" r="3.5" fill="#f43f5e" filter="url(#glow)" />
  <circle class="flow-packet-3" cx="200" cy="320" r="3.5" fill="#10b981" filter="url(#glow)" />
  <circle class="flow-packet-4" cx="1000" cy="320" r="3.5" fill="#818cf8" filter="url(#glow)" />

  <!-- Network Nodes (Interactive / Pulsing) -->
  <!-- Left Cluster -->
  <circle class="node-blue" cx="120" cy="110" r="5" fill="#38bdf8" />
  <circle class="node-pink" cx="280" cy="60" r="5" fill="#ec4899" />
  <circle class="node-green" cx="190" cy="200" r="5" fill="#34d399" />
  <circle class="node-blue" cx="130" cy="290" r="5" fill="#06b6d4" />
  <circle class="node-pink" cx="240" cy="340" r="5" fill="#818cf8" />
  <circle class="node-green" cx="390" cy="120" r="5" fill="#10b981" />
  <circle class="node-blue" cx="380" cy="350" r="5" fill="#38bdf8" />

  <!-- Right Cluster -->
  <circle class="node-pink" cx="1080" cy="110" r="5" fill="#f43f5e" />
  <circle class="node-blue" cx="920" cy="60" r="5" fill="#38bdf8" />
  <circle class="node-green" cx="1010" cy="200" r="5" fill="#34d399" />
  <circle class="node-pink" cx="1070" cy="290" r="5" fill="#ec4899" />
  <circle class="node-blue" cx="960" cy="340" r="5" fill="#6366f1" />
  <circle class="node-green" cx="810" cy="120" r="5" fill="#10b981" />
  <circle class="node-pink" cx="820" cy="350" r="5" fill="#f43f5e" />

  <!-- Left Floating Tech Badges -->
  <g class="pill-anim-1">
    <g transform="translate(60, 45)">
      <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" opacity="0.95" filter="url(#cardShadow)" />
      <circle cx="18" cy="17" r="6" fill="#0ea5e9" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">WireGuard®</text>
    </g>
    <g transform="translate(80, 220)">
      <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" filter="url(#cardShadow)" />
      <circle cx="18" cy="17" r="6" fill="#a855f7" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f3e8ff">Tailscale</text>
    </g>
  </g>

  <!-- Right Floating Tech Badges -->
  <g class="pill-anim-2">
    <g transform="translate(1000, 45)">
      <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95" filter="url(#cardShadow)" />
      <circle cx="18" cy="17" r="6" fill="#10b981" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d1fae5">Headscale</text>
    </g>
    <g transform="translate(990, 220)">
      <rect width="135" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" opacity="0.95" filter="url(#cardShadow)" />
      <circle cx="18" cy="17" r="6" fill="#f59e0b" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fef3c7">NetBird P2P</text>
    </g>
  </g>

  <!-- Centered Foreground Backdrop (Protects title/subtitle from being obscured) -->
  <rect x="290" y="70" width="620" height="260" rx="24" fill="#0a0f1d" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Shield / Lock Brand Icon in Center Box -->
  <g transform="translate(578, 92)">
    <circle cx="22" cy="22" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <path d="M22 10 L34 15 V24 C34 31 29 37 22 40 C15 37 10 31 10 24 V15 Z" fill="none" stroke="url(#titleGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M19 23 L22 26 L27 20" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle (Crisp Foreground, 100% Legibility) -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">AWESOME VPN &amp; MESH NETWORKING</text>

  <text x="600" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#94a3b8" letter-spacing="0.2">Curated Zero-Trust Overlay Networks, P2P Meshes &amp; WireGuard Ecosystems</text>

  <!-- Bottom Pills Inside Card Container -->
  <g transform="translate(325, 255)">
    <g transform="translate(0, 0)">
      <rect width="165" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">⚡ P2P WireGuard Mesh</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a855f7">🛡️ Zero Trust Network (ZTNA)</text>
    </g>
    <g transform="translate(375, 0)">
      <rect width="175" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="87" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#34d399">🌐 Self-Hosted &amp; Open Source</text>
    </g>
  </g>
</svg>
